<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NT1L7-8特訓</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--ud:"UD デジタル教科書体 NK-R","UD デジタル教科書体 N-R","UD デジタル教科書体 NP-R","UD Digital Kyokasho NK-R","UD Digital Kyokasho N-R","UD Digital Kyokasho NP-R","UDDigiKyokashoNK-R","UDDigiKyokashoN-R","UDDigiKyokashoNP-R","BIZ UDPGothic","BIZ UDGothic","BIZ UDPMincho","Hiragino Sans","Yu Gothic","Noto Sans JP",system-ui,sans-serif;--bg:#f3f5f4;--card:#fff;--tx:#1c2523;--mut:#66726f;--bd:#d8dedc;--board:#1f3a34;--chalk:#f2f4ef;--hi:#e8c547;--ok:#23804f;--ng:#c0392b;--sel:#1f3a34;--selx:#f2f4ef}
@media(prefers-color-scheme:dark){:root{--bg:#121816;--card:#1a2220;--tx:#e6ebe9;--mut:#93a09c;--bd:#2c3835;--board:#0f1f1b;--chalk:#eef1ec;--ok:#46c07f;--ng:#ff7b6e;--sel:#e8c547;--selx:#14201d}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.7 var(--ud)}
header{background:var(--board);color:var(--chalk);padding:18px 16px 14px;border-bottom:5px solid var(--hi)}
header h1{margin:0;font-size:26px;letter-spacing:.12em;font-weight:700}
header p{margin:2px 0 0;font-size:13px;opacity:.8}
main{max-width:720px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:16px;margin-bottom:14px}
h2{font-size:15px;margin:0 0 10px;color:var(--mut);font-weight:700}
.row{display:flex;flex-wrap:wrap;gap:8px}
.grid6{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
@media(min-width:520px){.grid6{grid-template-columns:repeat(3,1fr)}}
button,select,input[type=text]{font:inherit;color:inherit}
.opt{flex:1 1 0;min-width:96px;padding:10px 8px;border:1.5px solid var(--bd);background:var(--card);border-radius:8px;cursor:pointer;text-align:center}
.opt.on{background:var(--sel);color:var(--selx);border-color:var(--sel);font-weight:700}
.opt small{display:block;font-size:12px;opacity:.75;font-weight:400}
select{width:100%;padding:10px;border:1.5px solid var(--bd);border-radius:8px;background:var(--card)}
.go{width:100%;padding:14px;border:0;border-radius:10px;background:var(--board);color:var(--chalk);font-size:18px;font-weight:700;cursor:pointer;border-bottom:4px solid var(--hi)}
.go:disabled{opacity:.4;cursor:not-allowed}
.link{background:none;border:0;color:var(--mut);text-decoration:underline;cursor:pointer;padding:6px 0}
.bar{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px;font-size:14px;color:var(--mut)}
.bar button{padding:6px 12px;border:1.5px solid var(--bd);background:var(--card);border-radius:8px;cursor:pointer}
.prog{height:6px;background:var(--bd);border-radius:3px;margin-bottom:14px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--hi)}
.unit{font-size:12px;color:var(--mut);margin-bottom:6px}
.q{font:20px/1.9 var(--ud);white-space:pre-wrap;word-break:break-word;margin:0 0 14px}
.ch{display:block;width:100%;text-align:left;padding:12px 14px;margin-bottom:8px;border:1.5px solid var(--bd);background:var(--card);border-radius:8px;cursor:pointer;font-size:17px}
.ch b{display:inline-block;width:1.6em;color:var(--mut)}
.ch.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 16%,transparent)}
.ch.ng{border-color:var(--ng);background:color-mix(in srgb,var(--ng) 16%,transparent)}
.ch:disabled{cursor:default;color:inherit}
input[type=text]{width:100%;padding:12px;border:1.5px solid var(--bd);border-radius:8px;background:var(--card);font-size:18px}
.fb{margin-top:14px;padding:12px 14px;border-radius:8px;border-left:6px solid var(--ok);background:color-mix(in srgb,var(--ok) 10%,transparent)}
.fb.bad{border-color:var(--ng);background:color-mix(in srgb,var(--ng) 10%,transparent)}
.fb h3{margin:0 0 4px;font-size:18px}
.fb p{margin:4px 0}
.ans{font-family:var(--ud);font-size:18px;font-weight:700}
.acts{display:flex;gap:8px;margin-top:12px}
.acts button{flex:1;padding:12px;border-radius:8px;border:1.5px solid var(--bd);background:var(--card);cursor:pointer}
.acts .next{background:var(--board);color:var(--chalk);border-color:var(--board);font-weight:700}
.acts .st.on{background:var(--hi);color:#2a2200;border-color:var(--hi);font-weight:700}
.big{font-size:44px;font-weight:700;text-align:center;margin:6px 0}
.li{padding:10px 0;border-top:1px solid var(--bd)}
.li:first-child{border-top:0}
.msg{padding:14px;border:1.5px dashed var(--ng);border-radius:8px}
.rec{padding:12px 0;border-top:1px solid var(--bd)}.rec:first-child{border-top:0}.rec h3{margin:0 0 6px;font-size:16px}
.m{display:flex;align-items:center;gap:8px;font-size:14px;margin:4px 0}.m span{width:4em;color:var(--mut)}.m .t{flex:1;height:10px;background:var(--bd);border-radius:5px;overflow:hidden}.m .t i{display:block;height:100%}.m b{width:3.4em;text-align:right}.sub{font-size:12px;color:var(--mut)}
:focus-visible{outline:3px solid var(--hi);outline-offset:2px}
</style>
</head>
<body>
<header><h1 id="ttl">NT1L7-8特訓</h1><p id="sub"></p></header>
<main id="app"></main>
<script>
const verbDrillQuestions = [
  { type: "fill", q: "次の動詞の過去形を入力しなさい：[ begin ]", answer: "began", explanation: "【不規則動詞】begin ➔ began [bɪgǽn]" },
  { type: "fill", q: "次の動詞の過去形を入力しなさい：[ bring ]", answer: "brought", explanation: "【不規則動詞】bring ➔ brought [brɔːt]" },
  { type: "fill", q: "次の動詞の過去形を入力しなさい：[ buy ]", answer: "bought", explanation: "【不規則動詞】buy ➔ bought [bɔːt]" },
  { type: "fill", q: "次の動詞の過去形を入力しなさい：[ come ]", answer: "came", explanation: "【不規則動詞】come ➔ came [keɪm]" },
  { type: "fill", q: "次の動詞の過去形を入力しなさい：[ do ]", answer: "did", explanation: "【不規則動詞】do ➔ did [dɪd]" },
  { type: "fill", q: "次の動詞の過去形を入力しなさい：[ eat ]", answer: "ate", explanation: "【不規則動詞】eat ➔ ate [eɪt]" },
  { type: "fill", q: "次の動詞の過去形を入力しなさい：[ forget ]", answer: "forgot", explanation: "【不規則動詞】forget ➔ forgot [fərgά(ː)t]" },
  { type: "fill", q: "次の動詞の過去形を入力しなさい：[ get ]", answer: "got", explanation: "【不規則動詞】get ➔ got [gά(ː)t]" },
  { type: "fill", q: "次の動詞の過去形を入力しなさい：[ give ]", answer: "gave", explanation: "【不規則動詞】give ➔ gave [geɪv]" },
  { type: "fill", q: "次の動詞の過去形を入力しなさい：[ go ]", answer: "went", explanation: "【不規則動詞】go ➔ went [went]" },
  { type: "fill", q: "次の動詞の過去形を入力しなさい：[ have ]", answer: "had", explanation: "【不規則動詞】have ➔ had [hæd]" },
  { type: "fill", q: "次の動詞の過去形を入力しなさい：[ hear ]", answer: "heard", explanation: "【不規則動詞】hear ➔ heard [həːrd]" },
  { type: "fill", q: "次の動詞の過去形を入力しなさい：[ know ]", answer: "knew", explanation: "【不規則動詞】know ➔ knew [njúː]" },
  { type: "fill", q: "次の動詞の過去形を入力しなさい：[ lose ]", answer: "lost", explanation: "【不規則動詞】lose ➔ lost [lɔːst]" },
  { type: "fill", q: "次の動詞の過去形を入力しなさい：[ make ]", answer: "made", explanation: "【不規則動詞】make ➔ made [meɪd]" },
  { type: "fill", q: "次の動詞の過去形を入力しなさい：[ meet ]", answer: "met", explanation: "【不規則動詞】meet ➔ met [met]" },
  { type: "fill", q: "次の動詞の過去形を入力しなさい：[ put ]", answer: "put", explanation: "【不規則動詞】put ➔ put [pʊt] （原形と同形）" },
  { type: "fill", q: "次の動詞の過去形を入力しなさい：[ read ]", answer: "read", explanation: "【不規則動詞】read ➔ read [red]" },
  { type: "fill", q: "次の動詞の過去形を入力しなさい：[ run ]", answer: "ran", explanation: "【不規則動詞】run ➔ ran [ræn]" },
  { type: "fill", q: "次の動詞の過去形を入力しなさい：[ say ]", answer: "said", explanation: "【不規則動詞】say ➔ said [sed]" },
  { type: "fill", q: "次の動詞の過去形を入力しなさい：[ see ]", answer: "saw", explanation: "【不規則動詞】see ➔ saw [sɔː]" },
  { type: "fill", q: "次の動詞の過去形を入力しなさい：[ sell ]", answer: "sold", explanation: "【不規則動詞】sell ➔ sold [soʊld]" },
  { type: "fill", q: "次の動詞の過去形を入力しなさい：[ send ]", answer: "sent", explanation: "【不規則動詞】send ➔ sent [sent]" },
  { type: "fill", q: "次の動詞の過去形を入力しなさい：[ sing ]", answer: "sang", explanation: "【不規則動詞】sing ➔ sang [sæŋ]" },
  { type: "fill", q: "次の動詞の過去形を入力しなさい：[ speak ]", answer: "spoke", explanation: "【不規則動詞】speak ➔ spoke [spoʊk]" },
  { type: "fill", q: "次の動詞の過去形を入力しなさい：[ swim ]", answer: "swam", explanation: "【不規則動詞】swim ➔ swam [swæm]" },
  { type: "fill", q: "次の動詞の過去形を入力しなさい：[ take ]", answer: "took", explanation: "【不規則動詞】take ➔ took [tʊk]" },
  { type: "fill", q: "次の動詞の過去形を入力しなさい：[ teach ]", answer: "taught", explanation: "【不規則動詞】teach ➔ taught [tɔːt]" },
  { type: "fill", q: "次の動詞の過去形を入力しなさい：[ tell ]", answer: "told", explanation: "【不規則動詞】tell ➔ told [toʊld]" },
  { type: "fill", q: "次の動詞の過去形を入力しなさい：[ write ]", answer: "wrote", explanation: "【不規則動詞】write ➔ wrote [roʊt]" },
  { type: "fill", q: "次の動詞の過去形を入力しなさい：[ play ]", answer: "played", explanation: "【規則動詞】そのまま -ed をつける (played)" },
  { type: "fill", q: "次の動詞の過去形を入力しなさい：[ clean ]", answer: "cleaned", explanation: "【規則動詞】そのまま -ed をつける (cleaned)" },
  { type: "fill", q: "次の動詞の過去形を入力しなさい：[ help ]", answer: "helped", explanation: "【規則動詞】そのまま -ed をつける (helped)" },
  { type: "fill", q: "次の動詞の過去形を入力しなさい：[ visit ]", answer: "visited", explanation: "【規則動詞】そのまま -ed をつける (visited)" },
  { type: "fill", q: "次の動詞の過去形を入力しなさい：[ arrive ]", answer: "arrived", explanation: "【規則動詞】-e で終わる動詞： -d だけをつける (arrived)" },
  { type: "fill", q: "次の動詞の過去形を入力しなさい：[ like ]", answer: "liked", explanation: "【規則動詞】-e で終わる動詞： -d だけをつける (liked)" },
  { type: "fill", q: "次の動詞の過去形を入力しなさい：[ live ]", answer: "lived", explanation: "【規則動詞】-e で終わる動詞： -d だけをつける (lived)" },
  { type: "fill", q: "次の動詞の過去形を入力しなさい：[ use ]", answer: "used", explanation: "【規則動詞】-e で終わる動詞： -d だけをつける (used)" },
  { type: "fill", q: "次の動詞の過去形を入力しなさい：[ study ]", answer: "studied", explanation: "【規則動詞】＜子音字 ＋ y＞： y を i に変えて -ed をつける (studied)" },
  { type: "fill", q: "次の動詞の過去形を入力しなさい：[ cry ]", answer: "cried", explanation: "【規則動詞】＜子音字 ＋ y＞： y を i に変えて -ed をつける (cried)" },
  { type: "fill", q: "次の動詞の過去形を入力しなさい：[ carry ]", answer: "carried", explanation: "【規則動詞】＜子音字 ＋ y＞： y を i に変えて -ed をつける (carried)" },
  { type: "fill", q: "次の動詞の過去形を入力しなさい：[ try ]", answer: "tried", explanation: "【規則動詞】＜子音字 ＋ y＞： y を i に変えて -ed をつける (tried)" },
  { type: "fill", q: "次の動詞の過去形を入力しなさい：[ stop ]", answer: "stopped", explanation: "【規則動詞】＜短母音 ＋ 子音字＞： 子音字を重ねて -ed をつける (stopped)" },
  { type: "fill", q: "次の動詞の過去形を入力しなさい：[ drop ]", answer: "dropped", explanation: "【規則動詞】＜短母音 ＋ 子音字＞： 子音字を重ねて -ed をつける (dropped)" },
  { type: "fill", q: "次の動詞の過去形を入力しなさい：[ plan ]", answer: "planned", explanation: "【規則動詞】＜短母音 ＋ 子音字＞： 子音字を重ねて -ed をつける (planned)" }
];

const CSV_FILE='NT1_L7_L8_questions.csv';
const MODES=['L7文法','L7READ','L8文法','L8READ','間違えた問題のみ','動詞の過去形特訓'];
let ALL=[], S={mode:'L7文法',order:'seq',n:10}, Q=null, WARN=[], LSK='quiz_v1';
let st={stock:[],rec:{}};
const loadSt=()=>{
  let o={};try{o=JSON.parse(localStorage.getItem(LSK))||{}}catch(e){}
  return{stock:Array.isArray(o.stock)?o.stock:[],rec:o.rec&&typeof o.rec=='object'?o.rec:{}};
};
const save=()=>{try{localStorage.setItem(LSK,JSON.stringify(st))}catch(e){}};
const $=s=>document.querySelector(s), app=$('#app');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const norm=s=>String(s).replace(/[’‘]/g,"'").replace(/[“”]/g,'"').replace(/\s+/g,' ').trim().toLowerCase();
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};

function parseCSV(t){
  t=t.replace(/^\uFEFF/,'');const rows=[];let r=[],f='',q=false;
  for(let i=0;i<t.length;i++){const c=t[i];
    if(q){if(c=='"'){if(t[i+1]=='"'){f+='"';i++}else q=false}else f+=c}
    else if(c=='"')q=true;
    else if(c==','){r.push(f);f=''}
    else if(c=='\n'||c=='\r'){if(c=='\r'&&t[i+1]=='\n')i++;r.push(f);f='';if(r.length>1||r[0]!=='')rows.push(r);r=[]}
    else f+=c}
  if(f!==''||r.length){r.push(f);rows.push(r)}
  const h=rows.shift().map(x=>x.trim());
  return rows.map(x=>{const o={};h.forEach((k,i)=>o[k]=x[i]??'');return o});
}

function appendVerbDrill(){
  verbDrillQuestions.forEach((v,idx)=>{
    ALL.push({
      no: 900001 + idx,
      q: v.q,
      c: ['','','',''],
      a: v.answer,
      ex: v.explanation || '',
      unit: '動詞の過去形特訓',
      fmt: v.type === 'fill' ? '入力' : '4択',
      alt: []
    });
  });
}

function setData(text){
  const rows=parseCSV(text).filter(o=>(o['問題']||'').trim());
  const first=k=>{const r=rows.find(o=>(o[k]||'').trim());return r?r[k].trim():''};
  const title=first('アプリ名')||'問題演習';
  WARN=[];ALL=[];const used=new Set();
  rows.forEach((o,i)=>{
    const row=i+2;let no=parseInt(o['No'],10);
    if(!isFinite(no)||used.has(no)){WARN.push(`${row}行目: No が空か重複しています(自動で番号を振りました。記録のため No は固定を推奨)`);no=100000+i}
    const c=['A','B','C','D'].map(k=>(o['選択肢'+k]||'').trim());
    const fmt=(o['形式']||'').trim()||(c[0]?'4択':'入力');
    const a=(o['正解']||'').trim(), A=a.toUpperCase();
    if(fmt=='4択'){
      if(c.filter(Boolean).length<2||!'ABCD'.includes(A)||A.length!=1||!c['ABCD'.indexOf(A)]){WARN.push(`${row}行目(No.${no}): 4択の選択肢か正解(A〜D)が正しくないため除外しました`);return}
    }else if(fmt=='入力'){
      if(!a){WARN.push(`${row}行目(No.${no}): 入力問題の正解が空のため除外しました`);return}
    }else{WARN.push(`${row}行目(No.${no}): 形式は「4択」か「入力」にしてください(除外しました)`);return}
    used.add(no);
    ALL.push({no,q:(o['問題']).replace(/\r\n?/g,'\n').replace(/[ \t]*\n?[ \t]*(【(?:和訳|指示)】)/,'\n$1'),c,a:fmt=='4択'?A:a,ex:o['解説']||'',
      unit:(o['単元']||o['分野']||'').trim()||'その他',fmt,alt:(o['別解']||'').split('|').map(x=>x.trim()).filter(Boolean)});
  });
  appendVerbDrill();
  LSK='quiz_v1_'+title;
  st=loadSt();
  document.title=title;$('#ttl').textContent=title;$('#sub').textContent=first('サブタイトル');
  home();
}
const byNo=n=>ALL.find(q=>q.no===n);

function init(){
  fetch(CSV_FILE,{cache:'no-store'}).then(r=>{if(!r.ok)throw 0;return r.text()}).then(setData).catch(()=>{
    app.innerHTML=`<div class="msg"><b>${esc(CSV_FILE)} を読み込めませんでした。</b><p>index.html と同じフォルダにCSVを置き、GitHub Pagesなどのサーバー経由で開いてください。ファイルを直接開いている場合は、下のボタンからCSVを選べます。</p><input type="file" id="f" accept=".csv"></div>`;
    $('#f').onchange=e=>{const fr=new FileReader();fr.onload=()=>setData(fr.result);fr.readAsText(e.target.files[0],'utf-8')};
  });
}

/* ---------- ホーム ---------- */
function poolByMode(mode){
  if(mode==='間違えた問題のみ')return ALL.filter(q=>st.stock.includes(q.no));
  return ALL.filter(q=>q.unit===mode);
}
function pool(){
  return poolByMode(S.mode);
}
function home(){
  Q=null;
  const p=pool();
  const isWrongMode=S.mode==='間違えた問題のみ';
  const cnt=(!isWrongMode && S.order==='random')?Math.min(S.n,p.length):p.length;
  const o=(on,attr,main,sub)=>`<button class="opt${on?' on':''}" ${attr}>${main}${sub?`<small>${sub}</small>`:''}</button>`;
  app.innerHTML=`${WARN.length?`<details class="msg" style="margin-bottom:14px"><summary>CSVに${WARN.length}件の確認事項があります</summary>${WARN.slice(0,30).map(esc).join('<br>')}</details>`:''}
  <div class="card"><h2>演習メニュー</h2><div class="grid6">
    ${MODES.map(m=>{
      const mc=poolByMode(m).length;
      return o(S.mode===m,`data-mode="${esc(m)}"`,esc(m),mc+'問');
    }).join('')}
  </div></div>
  ${!isWrongMode?`<div class="card"><h2>出題方法</h2><div class="row">
    ${o(S.order==='seq','data-order="seq"','全問（順番通り）',p.length+'問')}
    ${o(S.order==='random','data-order="random"','ランダム抽出')}
  </div></div>`:''}
  ${(!isWrongMode && S.order==='random')?`<div class="card"><h2>出題数</h2><div class="row">${[10,20,50].map(n=>o(S.n===n,`data-n="${n}"`,n+'問')).join('')}</div></div>`:''}
  <button class="go" id="start" ${cnt?'':'disabled'}>${cnt?`演習スタート (${cnt}問)`:(isWrongMode?'間違えた問題・ストック問題はまだありません':'問題がありません')}</button>
  <p style="text-align:center"><button class="link" id="rec">あなたの記録</button> <button class="link" id="stock">間違えた問題・ストック一覧 (${st.stock.length}問)</button></p>`;
  app.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{S.mode=b.dataset.mode;home()});
  app.querySelectorAll('[data-order]').forEach(b=>b.onclick=()=>{S.order=b.dataset.order;home()});
  app.querySelectorAll('[data-n]').forEach(b=>b.onclick=()=>{S.n=+b.dataset.n;home()});
  $('#start').onclick=start;$('#stock').onclick=stockView;$('#rec').onclick=recView;
}

/* ---------- 演習 ---------- */
function start(){
  let p=pool();
  if(S.mode==='間違えた問題のみ')p=shuffle(p);
  else if(S.order==='random')p=shuffle(p).slice(0,S.n);
  if(!p.length)return;
  Q={list:p,i:0,ok:0,ng:[],done:false};show();
}
function quit(){if(confirm('演習をやめてホームに戻りますか?\n(ここまでの正誤は保存されます)'))home()}
function show(){
  const q=Q.list[Q.i], total=Q.list.length;
  app.innerHTML=`
  <div class="bar"><span>${Q.i+1} / ${total}問 ・ 正解 ${Q.ok}</span><button id="quit">ホームに戻る</button></div>
  <div class="prog"><i style="width:${Q.i/total*100}%"></i></div>
  <div class="card"><div class="unit">${esc(q.unit)} (${esc(q.fmt)})</div>
  <p class="q">${esc(q.q)}</p>
  <div id="in">${q.fmt=='4択'
    ?q.c.map((t,i)=>t?`<button class="ch" data-k="${'ABCD'[i]}"><b>${'ABCD'[i]}</b>${esc(t)}</button>`:'').join('')
    :`<input type="text" id="ans" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="答えを入力"><div class="acts"><button class="next" id="ok">回答する</button></div>`}
  </div><div id="fb"></div></div>`;
  $('#quit').onclick=quit;
  if(q.fmt=='4択')app.querySelectorAll('.ch').forEach(b=>b.onclick=()=>judge(b.dataset.k));
  else{const a=$('#ans');a.focus();$('#ok').onclick=()=>judge(a.value);a.onkeydown=e=>{if(e.key=='Enter'&&!e.isComposing)judge(a.value)}}
}
function judge(v){
  const q=Q.list[Q.i];if(Q.done)return;
  let ok,ansText;
  if(q.fmt=='4択'){ok=v==q.a;ansText=q.a+'. '+q.c['ABCD'.indexOf(q.a)];}
  else{if(!norm(v))return;ok=[q.a,...q.alt].some(a=>norm(a)==norm(v));ansText=q.a+(q.alt.length?`(別解: ${q.alt.join(' / ')})`:'');}
  Q.done=true;Q.t=Date.now();
  const wasStock=st.stock.includes(q.no), auto=ok&&wasStock, added=!ok&&!wasStock;
  st.rec[q.no]=ok?'c':'x';
  if(ok){Q.ok++;if(wasStock)st.stock=st.stock.filter(n=>n!==q.no)}
  else{Q.ng.push(q);if(!wasStock)st.stock.push(q.no)}
  save();
  const lbl=()=>st.stock.includes(q.no)?'★ ストック済み':(auto?'☆ まだ自信がないのでストックに戻す':'☆ ストックに入れる');
  if(q.fmt=='4択')app.querySelectorAll('.ch').forEach(b=>{b.disabled=true;if(b.dataset.k==q.a)b.classList.add('ok');else if(b.dataset.k==v)b.classList.add('ng')});
  else{$('#ans').disabled=true;$('#ok').remove()}
  const last=Q.i==Q.list.length-1;
  $('#fb').innerHTML=`<div class="fb${ok?'':' bad'}"><h3>${ok?'◯ 正解':'✕ 不正解'}</h3>
    <p>正解: <span class="ans">${esc(ansText)}</span></p><p>${esc(q.ex)}</p>${auto?'<p class="sub">ストックした問題に正答したので、正答扱いになりストックから外れました。</p>':''}${added?'<p class="sub">間違えた問題なので、「間違えた問題のみ」に追加しました。</p>':''}</div>
    <div class="acts"><button class="st${st.stock.includes(q.no)?' on':''}" id="stk">${lbl()}</button>
    <button class="next" id="nx">${last?'結果を見る':'次の問題'}</button></div>`;
  $('#stk').onclick=e=>{toggleStock(q.no);e.target.classList.toggle('on',st.stock.includes(q.no));e.target.textContent=lbl()};
  $('#nx').onclick=()=>{Q.done=false;if(last)result();else{Q.i++;show();scrollTo(0,0)}};
}
document.addEventListener('keydown',e=>{
  if(e.key!='Enter'||e.isComposing||!Q||!Q.done||e.target.tagName=='BUTTON'||Date.now()-Q.t<400)return;
  const n=$('#nx');if(n){e.preventDefault();n.click()}
});
function toggleStock(n){st.stock=st.stock.includes(n)?st.stock.filter(x=>x!==n):[...st.stock,n];save()}
function result(){
  const t=Q.list.length;
  app.innerHTML=`<div class="card"><h2>結果</h2><div class="big">${Q.ok} / ${t}</div>
  <p style="text-align:center;margin:0">正答率 ${Math.round(Q.ok/t*100)}%</p></div>
  ${Q.ng.length?`<div class="card"><h2>間違えた問題(${Q.ng.length}問・「間違えた問題のみ」に追加済み)</h2>${Q.ng.map(q=>`<div class="li"><div class="q" style="font-size:17px;margin:0">${esc(q.q)}</div><div>正解: <span class="ans">${esc(q.a.length==1&&q.fmt=='4択'?q.a+'. '+q.c['ABCD'.indexOf(q.a)]:q.a)}</span></div></div>`).join('')}</div>`:''}
  <button class="go" id="h">ホームに戻る</button>`;
  $('#h').onclick=home;scrollTo(0,0);
}

/* ---------- あなたの記録 ---------- */
function stats(){
  return [...new Set(ALL.map(q=>q.unit))].map(u=>{
    const qs=ALL.filter(q=>q.unit==u);
    return{u,total:qs.length,tried:qs.filter(q=>st.rec[q.no]).length,
      ok:qs.filter(q=>st.rec[q.no]=='c'&&!st.stock.includes(q.no)).length};
  });
}
const pct=(a,b)=>b?Math.round(a/b*100):null;
function meter(label,v,color){
  return `<div class="m"><span>${label}</span><div class="t"><i style="width:${v||0}%;background:${color}"></i></div><b>${v==null?'—':v+'%'}</b></div>`;
}
function recView(){
  const ss=stats(), sum=ss.reduce((a,x)=>({total:a.total+x.total,tried:a.tried+x.tried,ok:a.ok+x.ok}),{total:0,tried:0,ok:0});
  const block=(name,x)=>`<div class="rec"><h3>${esc(name)}</h3>${meter('達成率',pct(x.ok,x.total),'var(--hi)')}${meter('正答率',pct(x.ok,x.tried),'var(--ok)')}
    <div class="sub">正答 ${x.ok}問 / 全${x.total}問 ・ 演習済み ${x.tried}問</div></div>`;
  app.innerHTML=`<div class="bar"><span>あなたの記録</span><button id="b">ホームに戻る</button></div>
  <div class="card">${block('全体',sum)}</div>
  <div class="card"><h2>単元・項目ごとの記録</h2>${ss.map(x=>block(x.u,x)).join('')}</div>
  <div class="card"><h2>達成率・正答率とは</h2>
    <p class="sub" style="margin:0 0 6px"><b>達成率</b> = 項目の全問題のうち、正答した問題の割合</p>
    <p class="sub" style="margin:0 0 6px"><b>正答率</b> = 演習した問題のうち、正答した問題の割合</p>
    <p class="sub" style="margin:0">・各問題の「最新の解答」で数えます(間違えた問題を後で正解すれば、正答になります)。<br>・間違えた問題と、自分で「ストック」した問題は、どちらも「間違えた問題のみ」に入ります。ストック中は正答に数えず、もう一度正答するとストックから外れて正答扱いになります。</p></div>
  <p style="text-align:center"><button class="link" id="reset">記録をリセットする</button></p>`;
  $('#b').onclick=home;
  $('#reset').onclick=()=>{if(confirm('正誤の記録(達成率・正答率)をリセットします。ストックした問題は残ります。よろしいですか?')){st.rec={};save();recView()}};
  scrollTo(0,0);
}

/* ---------- ストック ---------- */
function stockView(){
  const items=st.stock.map(byNo).filter(Boolean);
  app.innerHTML=`<div class="bar"><span>間違えた問題・ストック一覧(${items.length}問)</span><button id="b">ホームに戻る</button></div>
  <div class="card">${items.length?items.map(q=>`<div class="li"><div class="unit">${esc(q.unit)}(${q.fmt})</div>
    <div class="q" style="font-size:17px;margin:0 0 4px">${esc(q.q)}</div>
    <div>正解: <span class="ans">${esc(q.fmt=='4択'?q.a+'. '+q.c['ABCD'.indexOf(q.a)]:q.a)}</span></div>
    <div style="color:var(--mut);font-size:14px">${esc(q.ex)}</div>
    <button class="link" data-r="${q.no}">リストから外す</button></div>`).join(''):'<p>間違えた問題・ストックした問題はまだありません。演習で間違えた問題や、「ストック」を押した問題がここに溜まります。</p>'}</div>`;
  $('#b').onclick=home;
  app.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{toggleStock(+b.dataset.r);stockView()});
}
init();
</script>
